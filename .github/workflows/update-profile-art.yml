
name: Update profile art

# Refreshes the contribution graph SVG daily from real data.

"on":
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest

    # Your GitHub account
    env:
      GH_PROFILE_USER: anshumanarchit-crypto

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Scrape real contribution data
        run: python scripts/fetch_contributions.py

      - name: Render animated contribution graph SVG
        run: python scripts/render_heatmap_svg.py

      - name: Commit updated art
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution graph [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg"
