name: Generate contribution snake

"on":
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Platane/snk@v3
        with:
          github_user_name: anshumanarchit-crypto
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=%23087F78&color_dots=%23EAF1F9,%23C4E9E2,%2381D8C7,%233ABAA8,%23087F78
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%2351D9C4&color_dots=%23172235,%23144B46,%23147D70,%2325A695,%2351D9C4
      - name: Publish snake to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
