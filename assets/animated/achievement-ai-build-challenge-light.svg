<svg xmlns="http://www.w3.org/2000/svg" width="580" height="210" viewBox="0 0 580 210" role="img"><title>achievement ai build challenge light</title><style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .mono { font-family: "Cascadia Code", "SFMono-Regular", Consolas, monospace; }
      .pulse { animation: pulse 2.8s ease-in-out infinite; transform-origin:center; }
      .dash { stroke-dasharray: 12 14; animation: travel 14s linear infinite; }
      .rise { opacity:1; animation: rise .7s ease-out both; }
      .bar { transform-box: fill-box; transform-origin: bottom; animation: grow .9s cubic-bezier(.2,.8,.2,1) both; }
      @keyframes pulse { 0%,100% { opacity:.55; } 50% { opacity:1; } }
      @keyframes travel { to { stroke-dashoffset:-520; } }
      @keyframes rise { from { opacity:.45; transform:translateY(3px); } to { opacity:1; transform:translateY(0); } }
      @keyframes grow { from { transform:scaleY(.08); opacity:.35; } to { transform:scaleY(1); opacity:1; } }
      
